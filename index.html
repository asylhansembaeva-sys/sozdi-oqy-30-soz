<!doctype html>
<html lang="kk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta property="og:title" content="2 санының құрамы"><title>2 санының құрамы</title><style>
*{box-sizing:border-box}body{margin:0;font-family:'Times New Roman',serif;color:#132451;background:linear-gradient(140deg,#e2f3ff 0%,#f9e5f1 53%,#fff4d6 100%);min-height:100vh}main{max-width:760px;margin:auto;padding:24px 16px 45px}h1{text-align:center;font-size:clamp(36px,7vw,58px);margin:12px 0 22px}.status{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;font-size:clamp(24px,4.5vw,36px);margin-bottom:26px}.tree{position:relative;max-width:570px;margin:auto;height:300px}.top{position:absolute;top:0;left:50%;transform:translateX(-50%);width:180px;height:132px;background:#ffeb91;border:6px solid #db8700;border-radius:29px;display:grid;place-items:center;font-size:82px;font-weight:bold}.branches{position:absolute;left:10%;top:132px;width:80%;height:100px;overflow:visible}.bottom{position:absolute;top:214px;width:43%;height:94px;border:5px solid;border-radius:27px;display:grid;place-items:center;font-size:72px;font-weight:bold}.left{left:0;background:#bfd9fb;border-color:#5c9ff3}.right{right:0;background:#b9f4d0;border-color:#43d57a}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:25px auto 0;max-width:720px}.answers button{font-family:'Times New Roman',serif;font-weight:bold;font-size:clamp(42px,7vw,68px);color:#1198ed;background:white;border:4px solid #2866ed;border-radius:25px;min-height:112px;cursor:pointer}.answers button:active{background:#e2f0ff}.feedback{text-align:center;min-height:42px;font-size:30px;font-weight:bold;margin-top:14px}.celebrate{position:fixed;inset:0;background:rgba(14,38,86,.24);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}.celebrate.show{display:flex}.celebrate-message{background:#fff9cf;border:7px solid #f4b82d;border-radius:35px;box-shadow:0 12px 45px #24315c55;padding:38px 30px;text-align:center;color:#087bcb;font:bold clamp(38px,8vw,70px) "Times New Roman",serif;line-height:1.25}.celebrate-message small{display:block;color:#15934a;font-size:clamp(25px,5vw,43px);margin-top:12px}#again{display:block;margin:24px auto 0;background:#178cdb;color:white;border:0;border-radius:16px;padding:14px 28px;font:bold 30px 'Times New Roman',serif;cursor:pointer}.actions{text-align:center;margin-top:12px}.actions button{font: bold 26px 'Times New Roman',serif;border:2px solid #3655a6;border-radius:15px;background:#fff;padding:10px 22px;cursor:pointer}@media(max-width:520px){main{padding:20px 12px}h1{margin:12px 0 24px}.tree{height:265px}.top{width:145px;height:115px;font-size:72px}.branches{top:115px;height:85px}.bottom{top:195px;height:80px;font-size:62px}.answers{gap:10px;margin-top:15px}.answers button{min-height:90px;border-radius:21px}.status{gap:8px}}
</style></head><body><main><h1>2 санының құрамы</h1><div class="status"><span id="progress">Тапсырма: 1/3</span><span id="clock">00:00</span></div><div class="tree"><div class="top">2</div><svg class="branches" viewBox="0 0 460 100" preserveAspectRatio="none" aria-hidden="true"><path d="M230 0 V45 H75 V100 M230 45 H385 V100" fill="none" stroke="#67788e" stroke-width="6" stroke-linejoin="round"/></svg><div class="bottom left" id="known">0</div><div class="bottom right" id="missing">?</div></div><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button id="restart">Қайта бастау</button></div></main><div class="celebrate" id="celebrate" role="status" aria-live="assertive"><div class="celebrate-message" id="celebrateMessage">🌟 ЖАРАЙСЫҢ!<small>КЕЛЕСІ ТАПСЫРМА</small></div></div><script>
const tasks=Array.from({length:3},(_,i)=>i);let current=0,started=Date.now(),interval;const progress=document.getElementById('progress'),clock=document.getElementById('clock'),known=document.getElementById('known'),missing=document.getElementById('missing'),answers=document.getElementById('answers'),feedback=document.getElementById('feedback'),celebrate=document.getElementById('celebrate'),celebrateMessage=document.getElementById('celebrateMessage');let waiting=false;function tick(){let s=Math.floor((Date.now()-started)/1000);clock.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function render(){waiting=false;celebrate.classList.remove('show');progress.textContent='Тапсырма: '+(current+1)+'/3';known.textContent=tasks[current];missing.textContent='?';feedback.textContent='';answers.innerHTML='';for(let i=0;i<=2;i++){const b=document.createElement('button');b.textContent=i;b.onclick=()=>choose(i);answers.appendChild(b)}}function choose(n){if(waiting)return;if(n!==2-tasks[current]){feedback.textContent='Қайта ойланып көр!';return}waiting=true;missing.textContent=n;feedback.textContent='Дұрыс!';answers.querySelectorAll('button').forEach(b=>b.disabled=true);celebrateMessage.innerHTML='🌟 ЖАРАЙСЫҢ!<small>КЕЛЕСІ ТАПСЫРМА</small>';celebrate.classList.add('show');setTimeout(()=>{current++;if(current>=tasks.length){clearInterval(interval);progress.textContent='3/3 тапсырма';answers.innerHTML='';feedback.textContent='Барлық тапсырманы орындадың!';celebrateMessage.innerHTML='🏆 ЖАРАЙСЫҢ!<small>БАРЛЫҚ ТАПСЫРМА АЯҚТАЛДЫ!</small><button id="again" onclick="restartGame()">ҚАЙТА ОЙНАУ</button>';return}render()},1700)}function restartGame(){clearInterval(interval);waiting=false;celebrate.classList.remove('show');current=0;started=Date.now();tick();interval=setInterval(tick,1000);render()}document.getElementById('restart').onclick=restartGame;tick();interval=setInterval(tick,1000);render();
</script></body></html>
