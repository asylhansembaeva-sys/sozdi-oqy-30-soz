<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Сөзді оқы да, үстін бас</title><style>*{box-sizing:border-box}body{margin:0;font-family:'Times New Roman',serif;background:linear-gradient(130deg,#e8f5ff,#fff4e7,#f1e9ff);color:#171717;text-align:center;min-height:100vh;padding:20px 12px}h1{font-size:clamp(30px,4vw,52px);font-weight:900;margin:12px 0}p{font-size:clamp(20px,2.6vw,32px);font-weight:bold;margin:8px 0 15px}.status{font-size:26px;font-weight:bold;margin:10px}.board{max-width:1150px;margin:15px auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px}.tile{min-height:100px;border:3px solid #383838;border-radius:18px;font-family:'Times New Roman',serif;font-size:40px;font-weight:700;color:#000;cursor:pointer;box-shadow:0 4px 0 #0002;transition:transform .16s,opacity .22s}.tile:active{transform:scale(.94)}.tile.gone{visibility:hidden;pointer-events:none}.tile:nth-child(5n+1){background:#ffd8e5}.tile:nth-child(5n+2){background:#fff1a8}.tile:nth-child(5n+3){background:#d5f5c6}.tile:nth-child(5n+4){background:#c9edff}.tile:nth-child(5n){background:#e8d8ff}.actions button{font-family:'Times New Roman',serif;font-weight:bold;font-size:25px;padding:12px 28px;border:0;border-radius:14px;background:#1679cb;color:white;cursor:pointer}.done{display:none;font-size:clamp(34px,6vw,64px);font-weight:900;color:#176a2d;margin:25px 0}.done.show{display:block}@media(max-width:650px){body{padding:12px 6px}.board{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.tile{min-height:72px;font-size:clamp(28px,7vw,40px);border-width:2px;border-radius:12px}h1{font-size:32px}p{font-size:22px}.status{font-size:22px}}@media(max-width:340px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><h1>СӨЗДІ ОҚЫ ДА, ҮСТІН БАС!</h1><p>Сөзді оқы да, үстін бас — сөз жоғалады!</p><p>Дайын болсаң, баста!</p><div class="status" id="status" aria-live="polite">Оқылған сөздер: 0 / 30</div><main class="board" id="board"></main><div id="done" class="done" aria-live="polite">🌟 ЖАРАЙСЫҢ!<div style="font-size:28px;color:#222">Барлық 30 сөзді оқыдың!</div></div><div class="actions"><button id="restart">ҚАЙТА ОЙНАУ</button></div><script>const words=["ара", "аула", "науа", "асау", "аласа", "суар", "сона", "олар", "Рауан", "отар", "Отан", "тосу", "қалта", "тақта", "қарақат", "талқан", "асық", "алты", "торсық", "қызыл", "қазақ", "мол", "маса", "қалам", "марал", "елу", "емен", "дода", "ұзын", "құндыз"];const board=document.getElementById('board'),status=document.getElementById('status'),done=document.getElementById('done');let count=0;function start(){count=0;done.classList.remove('show');board.innerHTML='';status.textContent='Оқылған сөздер: 0 / 30';words.forEach(word=>{const b=document.createElement('button');b.className='tile';b.textContent=word;b.setAttribute('aria-label',word);b.onclick=()=>{if(b.classList.contains('gone'))return;b.classList.add('gone');count++;status.textContent=`Оқылған сөздер: ${count} / 30`;if(count===words.length){done.classList.add('show');}};board.appendChild(b)})}document.getElementById('restart').onclick=start;start();</script></body></html>
